<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Planet Viewer</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    margin:20px;
}

h1{
    margin-bottom:10px;
}

#status{
    color:#666;
    margin-bottom:10px;
}

#currentDate{
    font-size:22px;
    font-weight:bold;
    margin:15px;
}

.controls{
    margin:15px;
}

button{
    padding:8px 15px;
    font-size:16px;
    cursor:pointer;
}

#slider{
    width:90%;
}

canvas{
    background:white;
    border:1px solid #ccc;
}

</style>
</head>
<body>

<h1>Planet Viewer</h1>

<div id="status">
Loading...
</div>

<div id="currentDate">
Waiting for data...
</div>

<div class="controls">

<button id="prevBtn">
◀ Prev
</button>

<button id="todayBtn">
Today
</button>

<button id="viewBtn">
North Indian
</button>

<button id="nextBtn">
Next ▶
</button>

</div>

<input
    id="slider"
    type="range"
    min="0"
    max="0"
    value="0"
/>

<br><br>

<canvas
    id="chart"
    width="900"
    height="900">
</canvas>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<script>

let dataset = [];

let currentView = "circle";

const slider =
    document.getElementById('slider');

const status =
    document.getElementById('status');

const dateLabel =
    document.getElementById('currentDate');

const canvas =
    document.getElementById('chart');

const ctx =
    canvas.getContext('2d');

window.onload = loadData;

async function loadData(){

    try{

        status.textContent =
            "Loading CSV...";

        const response =
            await fetch(
                "output_full_200_years.csv.gz"
            );

        if(!response.ok){

            throw new Error(
                "Cannot find output_full_200_years.csv.gz"
            );
        }
		
		const compressed =
			await response.arrayBuffer();

		const text =
			pako.ungzip(
				new Uint8Array(compressed),
				{ to: "string" }
			);

        status.textContent =
            "Parsing rows...";

        const lines =
            text.trim().split("\n");

        dataset =
            lines.slice(1)
                 .map(
                    line =>
                    line.split(",")
                 );

        slider.max =
            dataset.length - 1;

        jumpToCurrentDate();

        drawCurrent();

        status.textContent =
            `Loaded ${dataset.length.toLocaleString()} rows`;

    }
    catch(ex){

        console.error(ex);

        status.textContent =
            ex.message;
    }
}

function jumpToCurrentDate(){

    const start =
        new Date(
            "1900-01-01T01:00:00"
        );

    const now =
        new Date();

    const diffHours =
        (now - start)
        /
        (1000 * 60 * 60);

    let index =
        Math.round(
            diffHours / 2
        );

    index =
        Math.max(
            0,
            Math.min(
                index,
                dataset.length - 1
            )
        );

    slider.value = index;
}

slider.addEventListener(
    "input",
    drawCurrent
);

document
.getElementById("prevBtn")
.addEventListener(
    "click",
    ()=>{

        slider.value =
            Math.max(
                0,
                Number(slider.value)-1
            );

        drawCurrent();
    }
);

document
.getElementById("nextBtn")
.addEventListener(
    "click",
    ()=>{

        slider.value =
            Math.min(
                dataset.length-1,
                Number(slider.value)+1
            );

        drawCurrent();
    }
);

document
.getElementById("todayBtn")
.addEventListener(
    "click",
    ()=>{
        jumpToCurrentDate();
        drawCurrent();
    }
);

document
.getElementById("viewBtn")
.addEventListener(
    "click",
    ()=>{

        if(currentView==="circle")
        {
            currentView="north";

            document
            .getElementById("viewBtn")
            .textContent =
            "Circle";
        }
        else
        {
            currentView="circle";

            document
            .getElementById("viewBtn")
            .textContent =
            "North Indian";
        }

        drawCurrent();
    }
);

function decodePosition(text){

    const p =
        text.trim().split(" ");

    return {

        degree:
            Number(p[0]),

        minute:
            Number(p[1])
    };
}

function drawCurrent(){

    if(dataset.length===0)
        return;

    const row =
        dataset[slider.value];

    dateLabel.textContent =
        row[0];

    if(currentView==="circle")
	{
		drawCircleChart(row);
	}
	else
	{
		drawNorthIndianChart(row);
	}
}

function drawCircleChart(row){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const cx = 450;
    const cy = 450;

    //--------------------------------
    // ZODIAC OUTER CIRCLE
    //--------------------------------

    const zodiacRadius = 350;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        zodiacRadius,
        0,
        Math.PI*2
    );

    ctx.stroke();

    //--------------------------------
    // 12 SIGNS
    //--------------------------------

    for(let i=0;i<12;i++){

        const angle =
            (i*30 - 90)
            * Math.PI / 180;

        ctx.beginPath();

        ctx.moveTo(
            cx,
            cy
        );

        ctx.lineTo(
            cx +
            zodiacRadius *
            Math.cos(angle),

            cy +
            zodiacRadius *
            Math.sin(angle)
        );

        ctx.stroke();
    }

    //--------------------------------
    // PLANETS
    //--------------------------------

    const planets = [

        {name:"Su",col:1,r:90,color:"#ff9800"},
        {name:"Mo",col:2,r:130,color:"#9c27b0"},
        {name:"Me",col:3,r:170,color:"#03a9f4"},
        {name:"Ve",col:4,r:210,color:"#673ab7"},
        {name:"Ma",col:5,r:250,color:"#f44336"},
        {name:"Ju",col:6,r:290,color:"#4caf50"},
        {name:"Sa",col:7,r:330,color:"#212121"},

        {name:"Ra",col:8,r:400,color:"#795548"},
        {name:"Ke",col:10,r:450,color:"#607d8b"}

    ];

    for(const planet of planets){

        const pos =
            decodePosition(
                row[planet.col]
            );

        const zodiac =
            pos.degree +
            pos.minute/60;

        const angle =
            (zodiac - 90)
            * Math.PI / 180;

        const x =
            cx +
            planet.r *
            Math.cos(angle);

        const y =
            cy +
            planet.r *
            Math.sin(angle);

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            18,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            planet.color;

        ctx.fill();

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 12px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            planet.name,
            x,
            y
        );
    }

    //--------------------------------
    // CENTER
    //--------------------------------

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "black";

    ctx.fill();
}

const orbitRadius =
{
	"Su":10,
	"Mo":25,
	"Me":40,
	"Ve":55,
	"Ma":70,
	"Ju":85,
	"Sa":100,
	"Ra":115,
	"Ke":130
};

function drawNorthIndianChart(row)
{
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const left = 150;
    const top = 150;
    const size = 600;

    ctx.lineWidth = 2;

    ctx.strokeRect(
        left,
        top,
        size,
        size
    );

    ctx.beginPath();

    ctx.moveTo(left,top);
    ctx.lineTo(left+size,top+size);

    ctx.moveTo(left+size,top);
    ctx.lineTo(left,top+size);

    ctx.moveTo(left+size/2,top);
    ctx.lineTo(left+size,top+size/2);

    ctx.moveTo(left+size,top+size/2);
    ctx.lineTo(left+size/2,top+size);

    ctx.moveTo(left+size/2,top+size);
    ctx.lineTo(left,top+size/2);

    ctx.moveTo(left,top+size/2);
    ctx.lineTo(left+size/2,top);

    ctx.stroke();

    const centers =
    [
        [450,250],
        [600,225],
        [675,300],
        [675,450],
        [675,600],
        [600,675],

        [450,650],
        [300,675],
        [225,600],
        [225,450],
        [225,300],
        [300,225]
    ];

    ctx.fillStyle = "red";

	ctx.font = "bold 28px Arial";

	ctx.fillText(
		"3",
		450,
		250
	);

    const planets =
    [
        ["Su",1],
        ["Mo",2],
        ["Me",3],
        ["Ve",4],
        ["Ma",5],
        ["Ju",6],
        ["Sa",7],
        ["Ra",8],
        ["Ke",10]
    ];

    const signToHouse =
	{
		2:0,    // Gemini
		1:1,    // Taurus
		0:2,    // Aries
		11:3,   // Pisces
		10:4,   // Aquarius
		9:5,    // Capricorn
		8:6,    // Sagittarius
		7:7,    // Scorpio
		6:8,    // Libra
		5:9,    // Virgo
		4:10,   // Leo
		3:11    // Cancer
	};

    planets.forEach(p=>{

		const pos =
			decodePosition(
				row[p[1]]
			);

		const sign =
			Math.floor(
				pos.degree / 30
			);

		const house =
			signToHouse[sign];

		if(house===undefined)
			return;

		const radius =
			orbitRadius[p[0]];

		const angle =
			house * Math.PI / 6;

		const x =
			centers[house][0]
			+
			radius *
			Math.cos(angle);

		const y =
			centers[house][1]
			+
			radius *
			Math.sin(angle);

		ctx.beginPath();

		ctx.arc(
			x,
			y,
			15,
			0,
			Math.PI*2
		);

		ctx.fillStyle =
		{
			"Su":"#ff9800",
			"Mo":"#9c27b0",
			"Me":"#03a9f4",
			"Ve":"#673ab7",
			"Ma":"#f44336",
			"Ju":"#4caf50",
			"Sa":"#212121",
			"Ra":"#795548",
			"Ke":"#607d8b"
		}[p[0]];

		ctx.fill();

		ctx.fillStyle = "white";

		ctx.font =
			"bold 12px Arial";

		ctx.textAlign =
			"center";

		ctx.textBaseline =
			"middle";

		ctx.fillText(
			p[0],
			x,
			y
		);

	});
}

</script>

</body>
</html>
