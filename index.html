<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Host Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }
        #pdf-container {
            width: 100%;
            height: calc(100vh - 30px);
        }
        #time-marquee {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: #222;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        #time-text {
            white-space: nowrap;
            padding-left: 100%;
            animation: scroll-left 15s linear infinite;
        }
        @keyframes scroll-left {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <script>
        window.location.href = "https://sap586.github.io/Resume/";
    </script>

</body>
</html>
