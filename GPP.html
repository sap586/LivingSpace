<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gantry Pick & Place Machine</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

#panel{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.75);
    padding:12px;
    border-radius:8px;
    z-index:100;
}

button{
    margin:2px;
    padding:8px 12px;
    cursor:pointer;
    border:none;
    border-radius:4px;
    background:#2f6fed;
    color:white;
}

button:hover{
    background:#4b84f1;
}

</style>

</head>

<body>

<div id="panel">

    <h3 style="margin-top:0;">
        Gantry Pick & Place Machine
    </h3>

    <button onclick="startMachine()">
        Start
    </button>

    <button onclick="stopMachine()">
        Stop
    </button>

    <br><br>

    <button onclick="setTopView()">
        Top View
    </button>

    <button onclick="setProductionView()">
        Production
    </button>

    <div style="margin-top:10px;">
        Cycle: Feeder → Pick → Place → Repeat
    </div>

</div>

<script type="module" src="./GPP/GPP.js"></script>

</body>
</html>
